name: Shapr3D
description: 'Shapr3D is a 3D CAD (computer-aided design) application built on the Siemens
  Parasolid geometric modeling engine, running natively on iPad, Apple Vision Pro, macOS,
  and Windows. It offers parametric solid modeling, 2D technical drawings, augmented-reality
  visualization, and industry-standard CAD file import/export for engineers, product
  designers, and hobbyists. Shapr3D is a portfolio company of Creandum, Point Nine, and
  Speedinvest. As of this enrichment pass the company publishes no public API, SDK, or
  developer program; its discoverable machine surface is limited to the corporate/product
  site, help center, and a Trust Center documenting SOC 2 Type II, ISO/IEC 27001:2022,
  and GDPR compliance plus a responsible-disclosure program.'
